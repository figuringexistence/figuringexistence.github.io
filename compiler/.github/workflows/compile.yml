name: Compile in /compiler

on:
  push:
    paths:
      - 'compiler/main.cpp'
      - 'compiler/main.c'
      - 'compiler/input.txt'
      - '.github/workflows/compile.yml'
  workflow_dispatch:
    inputs:
      language:
        description: 'Bahasa (cpp atau c)'
        required: true
        default: 'cpp'
      source_file:
        description: 'Path file di folder compiler'
        required: true
        default: 'compiler/main.cpp'

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile, Run, and Save JSON
        shell: bash
        run: |
          mkdir -p /tmp/compiler_build
          LANG_CHOICE="${{ github.event.inputs.language }}"
          SRC_FILE="${{ github.event.inputs.source_file }}"

          if [ -z "$LANG_CHOICE" ]; then
            if [[ "$SRC_FILE" == *.c ]]; then
              LANG_CHOICE="c"
            else
              LANG_CHOICE="cpp"
            fi
          fi

          if [ "$LANG_CHOICE" = "c" ]; then
            gcc "$SRC_FILE" -O2 -Wall -o /tmp/compiler_build/program > /tmp/compiler_build/compile_err.txt 2>&1
          else
            g++ "$SRC_FILE" -O2 -std=c++17 -Wall -o /tmp/compiler_build/program > /tmp/compiler_build/compile_err.txt 2>&1
          fi

          EXIT_CODE=$?
          RUN_OUTPUT=""

          if [ $EXIT_CODE -eq 0 ]; then
            if [ -f "compiler/input.txt" ]; then
              RUN_OUTPUT=$(/tmp/compiler_build/program < compiler/input.txt 2>&1)
            else
              RUN_OUTPUT=$(/tmp/compiler_build/program 2>&1)
            fi
            EXIT_CODE=$?
          else
            RUN_OUTPUT=$(cat /tmp/compiler_build/compile_err.txt)
          fi

          echo "$RUN_OUTPUT"

          node -e '
            const fs = require("fs");
            const payload = {
              source_file: process.env.SRC_FILE,
              language: process.env.LANG_CHOICE,
              exit_code: Number(process.env.EXIT_CODE),
              output: process.env.RUN_OUTPUT,
              updated_at: new Date().toISOString()
            };
            fs.writeFileSync("compiler/last-run.json", JSON.stringify(payload, null, 2));
          '
        env:
          SRC_FILE: ${{ github.event.inputs.source_file || 'compiler/main.cpp' }}
          LANG_CHOICE: ${{ github.event.inputs.language || 'cpp' }}
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          RUN_OUTPUT: ${{ steps.run.outputs.run_output }}

      - name: Commit last-run.json to /compiler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/last-run.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(compiler): update last-run.json"
            git push
          fi
