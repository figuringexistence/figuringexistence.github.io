<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Compiler - Figuring Existence</title>
  
  <!-- Devicon -->
  <link rel="stylesheet" href="https://unpkg.com/devicon@2.16.0/devicon.min.css">
  <!-- CodeMirror CSS & Tema Dracula -->
  <link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.16/lib/codemirror.css">
  <link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.16/theme/dracula.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #1c2130; color: #f8f8f2; display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar Kiri */
    .sidebar {
      width: 55px; background-color: #161a25; border-right: 1px solid #2d3348;
      display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 8px; overflow-y: auto;
    }
    .lang-btn {
      width: 40px; height: 40px; border-radius: 6px; border: 1px solid #2d3348;
      background: #1f2436; color: #a9b1d6; font-size: 18px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .lang-btn:hover { background: #2c334a; color: #fff; }
    .lang-btn.active { background: #1d63ed; color: #fff; border-color: #1d63ed; }

    /* Area Utama */
    .main-container { flex: 1; display: flex; }
    .pane { flex: 1; display: flex; flex-direction: column; height: 100%; border-right: 1px solid #2d3348; }
    
    .header {
      height: 48px; background-color: #1f2436; border-bottom: 1px solid #2d3348;
      display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
    }
    .file-tab {
      background: #1c2130; padding: 8px 16px; border-top: 2px solid #1d63ed;
      font-size: 14px; font-weight: 600; color: #fff;
    }
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      padding: 6px 12px; border-radius: 4px; border: none; font-size: 13px;
      font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.15s;
    }
    .btn-secondary { background: #2d3348; color: #f8f8f2; border: 1px solid #414868; }
    .btn-secondary:hover { background: #3b4261; }
    .btn-run { background: #1d63ed; color: #fff; }
    .btn-run:hover { background: #1552c9; }
    .btn-run:disabled { background: #414868; cursor: not-allowed; }

    /* Editor & Output */
    .editor-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; }
    textarea#codeEditor {
      width: 100%; height: 100%; background: #1c2130; color: #f8f8f2;
      border: none; outline: none; padding: 15px; font-family: 'Consolas', monospace;
      font-size: 14px; resize: none;
    }
    .CodeMirror { width: 100%; height: 100% !important; font-size: 14px; background: #1c2130 !important; }
    
    .output-area {
      flex: 1; background-color: #181a1f; padding: 15px; font-family: 'Consolas', monospace;
      font-size: 14px; white-space: pre-wrap; overflow-y: auto; color: #e2e8f0;
    }
    iframe.preview-frame { width: 100%; height: 100%; border: none; background: #fff; display: none; }
    
    .stdin-box {
      background: #1f2436; border-top: 1px solid #2d3348; padding: 8px 15px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .stdin-box label { font-size: 11px; color: #8c96b5; text-transform: uppercase; }
    .stdin-box textarea {
      background: #161a25; border: 1px solid #2d3348; color: #fff; padding: 6px;
      font-family: monospace; font-size: 13px; resize: none; height: 45px; border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar"></div>

  <div class="main-container">
    <!-- Panel Kiri: Editor -->
    <div class="pane">
      <div class="header">
        <div class="file-tab" id="fileName">main.py</div>
        <div class="actions">
          <button class="btn btn-secondary" id="copyCodeBtn" onclick="copyCode()" title="Salin kode">Copy</button>
          <button class="btn btn-secondary" onclick="resetCode()" title="Kembalikan ke template awal">Reset</button>
          <button class="btn btn-secondary" onclick="downloadCode()" title="Unduh file kode">⬇ Export</button>
          <button class="btn btn-run" id="runBtn" onclick="runCode()">Run ▶</button>
        </div>
      </div>
      <div class="editor-wrapper">
        <textarea id="codeEditor"></textarea>
      </div>
      <div class="stdin-box">
        <label>Input (Stdin - opsional jika program meminta input)</label>
        <textarea id="stdinInput" placeholder="Masukkan input program di sini..."></textarea>
      </div>
    </div>

    <!-- Panel Kanan: Output -->
    <div class="pane" style="border-right: none;">
      <div class="header">
        <div class="file-tab" style="border-color: transparent;">Output</div>
        <div class="actions">
          <button class="btn btn-secondary" id="copyOutBtn" onclick="copyOutput()">Copy</button>
          <button class="btn btn-secondary" onclick="clearOutput()">Clear</button>
        </div>
      </div>
      <div class="output-area" id="outputBox">Klik "Run ▶" untuk menjalankan kode...</div>
      <iframe id="htmlPreview" class="preview-frame"></iframe>
    </div>
  </div>

  <!-- CodeMirror JS -->
  <script src="https://unpkg.com/codemirror@5.65.16/lib/codemirror.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/python/python.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/clike/clike.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/javascript/javascript.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/xml/xml.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/go/go.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/rust/rust.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/r/r.js"></script>
  <script src="https://unpkg.com/codemirror@5.65.16/mode/sql/sql.js"></script>

  <script>
    const languages = [
      { id: 'python', name: 'Python', file: 'main.py', icon: 'devicon-python-plain', mode: 'python', piston: 'python', version: '3.10.0', template: 'print("Halo dari Python!")\n' },
      { id: 'r', name: 'R', file: 'main.r', icon: 'devicon-r-original', mode: 'r', piston: 'r', version: '4.1.1', template: 'print("Halo dari R!")\n' },
      { id: 'sql', name: 'SQLite', file: 'query.sql', icon: 'devicon-mysql-plain', mode: 'sql', piston: 'sqlite3', version: '3.36.0', template: 'SELECT "Halo dari SQL!" AS pesan;\n' },
      { id: 'html', name: 'HTML/JS', file: 'index.html', icon: 'devicon-html5-plain', mode: 'htmlmixed', piston: 'browser', version: '', template: '<!DOCTYPE html>\n<html>\n<body>\n  <h2 style="color:blue;">Halo HTML!</h2>\n</body>\n</html>' },
      { id: 'java', name: 'Java', file: 'Main.java', icon: 'devicon-java-plain', mode: 'text/x-java', piston: 'java', version: '15.0.2', template: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Halo dari Java!");\n    }\n}' },
      { id: 'kotlin', name: 'Kotlin', file: 'Main.kt', icon: 'devicon-kotlin-plain', mode: 'text/x-kotlin', piston: 'kotlin', version: '1.8.20', template: 'fun main() {\n    println("Halo dari Kotlin!")\n}' },
      { id: 'c', name: 'C', file: 'main.c', icon: 'devicon-c-plain', mode: 'text/x-csrc', piston: 'c', version: '10.2.0', template: '#include <stdio.h>\n\nint main() {\n    printf("Halo dari C!\\n");\n    return 0;\n}' },
      { id: 'cpp', name: 'C++', file: 'main.cpp', icon: 'devicon-cplusplus-plain', mode: 'text/x-c++src', piston: 'c++', version: '10.2.0', template: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Try clicking the Run button." << endl;\n    return 0;\n}' },
      { id: 'csharp', name: 'C#', file: 'Program.cs', icon: 'devicon-csharp-plain', mode: 'text/x-csharp', piston: 'csharp', version: '6.12.0', template: 'using System;\nclass Program {\n    static void Main() {\n        Console.WriteLine("Halo dari C#!");\n    }\n}' },
      { id: 'js', name: 'JavaScript', file: 'main.js', icon: 'devicon-javascript-plain', mode: 'javascript', piston: 'javascript', version: '18.15.0', template: 'console.log("Halo dari Node.js!");' },
      { id: 'ts', name: 'TypeScript', file: 'main.ts', icon: 'devicon-typescript-plain', mode: 'text/typescript', piston: 'typescript', version: '5.0.3', template: 'const pesan: string = "Halo dari TypeScript!";\nconsole.log(pesan);' },
      { id: 'go', name: 'Go', file: 'main.go', icon: 'devicon-go-original-wordmark', mode: 'go', piston: 'go', version: '1.16.2', template: 'package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Halo dari Go!")\n}' },
      { id: 'rust', name: 'Rust', file: 'main.rs', icon: 'devicon-rust-plain', mode: 'rust', piston: 'rust', version: '1.68.2', template: 'fn main() {\n    println!("Halo dari Rust!");\n}' }
    ];

    let currentLang = languages[0];
    let editor = null;

    // Render Sidebar
    const sidebar = document.getElementById('sidebar');
    languages.forEach((lang, index) => {
      const btn = document.createElement('button');
      btn.className = `lang-btn ${index === 0 ? 'active' : ''}`;
      btn.title = lang.name;
      btn.innerHTML = `<i class="${lang.icon}"></i>`;
      btn.onclick = () => selectLanguage(lang, btn);
      sidebar.appendChild(btn);
    });

    // Inisialisasi CodeMirror
    const textarea = document.getElementById('codeEditor');
    if (typeof CodeMirror !== 'undefined') {
      editor = CodeMirror.fromTextArea(textarea, {
        lineNumbers: true,
        theme: 'dracula',
        mode: currentLang.mode,
        indentUnit: 4,
        tabSize: 4
      });
      editor.setValue(currentLang.template);
    } else {
      textarea.value = currentLang.template;
    }

    function getCodeValue() {
      return editor ? editor.getValue() : textarea.value;
    }

    function setCodeValue(val) {
      if (editor) {
        editor.setValue(val);
      } else {
        textarea.value = val;
      }
    }

    function selectLanguage(lang, btnElement) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      
      document.getElementById('fileName').textContent = lang.file;
      if (editor) editor.setOption('mode', lang.mode);
      setCodeValue(lang.template);
      clearOutput();
    }

    // Fungsi Copy Kode
    function copyCode() {
      const code = getCodeValue();
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copyCodeBtn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }

    // Fungsi Reset Kode ke Template Awal
    function resetCode() {
      setCodeValue(currentLang.template);
      document.getElementById('stdinInput').value = '';
      clearOutput();
    }

    // Fungsi Copy Output
    function copyOutput() {
      const text = document.getElementById('outputBox').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyOutBtn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    }

    // Fungsi Run
    async function runCode() {
      const code = getCodeValue();
      const stdin = document.getElementById('stdinInput').value;
      const outputBox = document.getElementById('outputBox');
      const htmlPreview = document.getElementById('htmlPreview');
      const runBtn = document.getElementById('runBtn');

      if (currentLang.piston === 'browser') {
        outputBox.style.display = 'none';
        htmlPreview.style.display = 'block';
        htmlPreview.srcdoc = code;
        return;
      }

      htmlPreview.style.display = 'none';
      outputBox.style.display = 'block';
      outputBox.style.color = '#a9b1d6';
      outputBox.textContent = 'Menjalankan kode...';
      runBtn.disabled = true;

      try {
        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: currentLang.piston,
            version: currentLang.version,
            files: [{ name: currentLang.file, content: code }],
            stdin: stdin
          })
        });

        const data = await response.json();
        if (data.run) {
          const out = data.run.output || '(Program selesai tanpa output)';
          outputBox.style.color = data.run.code === 0 ? '#9ece6a' : '#f7768e';
          outputBox.textContent = out;
        } else {
          outputBox.style.color = '#f7768e';
          outputBox.textContent = 'Error API: ' + JSON.stringify(data);
        }
      } catch (err) {
        outputBox.style.color = '#f7768e';
        outputBox.textContent = 'Gagal terhubung ke server compiler: ' + err.message;
      } finally {
        runBtn.disabled = false;
      }
    }

    function downloadCode() {
      const code = getCodeValue();
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentLang.file;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearOutput() {
      document.getElementById('htmlPreview').style.display = 'none';
      const outputBox = document.getElementById('outputBox');
      outputBox.style.display = 'block';
      outputBox.style.color = '#e2e8f0';
      outputBox.textContent = '';
    }
  </script>
</body>
</html>
