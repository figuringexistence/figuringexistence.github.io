
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste Text - Yudi.TIF</title>
    
    <!-- Google AdSense Account Tag -->
    <meta name="google-adsense-account" content="ca-pub-7225836198965940">

    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (Realtime Database) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBu5FA5d0YvZs5yKigUpwxJMPHlEMzk3VM",
            authDomain: "pastetext-c8c02.firebaseapp.com",
            databaseURL: "https://pastetext-c8c02-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pastetext-c8c02",
            storageBucket: "pastetext-c8c02.firebasestorage.app",
            messagingSenderId: "954135576596",
            appId: "1:954135576596:web:51dbed9b5d4aca8f80e701",
            measurementId: "G-QSQM4WZN4Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let allPastes = {};
        let currentKey = null;

        // Simpan / Perbarui Paste ke Realtime Database
        window.savePaste = function() {
            const title = document.getElementById('paste-title').value.trim();
            const password = document.getElementById('paste-password').value;
            const content = document.getElementById('paste-content').value;

            if (!title || !content) {
                alert("Judul dan isi teks tidak boleh kosong!");
                return;
            }

            if (currentKey) {
                const item = allPastes[currentKey];
                if (item && item.password && item.password.length > 0) {
                    const inputPass = prompt("File ini dikunci. Masukkan password untuk menyimpan perubahan:");
                    if (inputPass === null) return;
                    if (inputPass !== item.password) {
                        alert("Password salah! Perubahan tidak disimpan.");
                        return;
                    }
                }

                update(ref(db, 'pastes/' + currentKey), {
                    title: title,
                    password: password,
                    content: content
                }).then(() => {
                    alert("Paste berhasil diperbarui!");
                }).catch((error) => {
                    console.error("Error:", error);
                    alert("Gagal memperbarui catatan!");
                });
            } else {
                const newRef = push(ref(db, 'pastes'));
                const newKey = newRef.key;

                update(newRef, {
                    title: title,
                    password: password,
                    content: content,
                    createdAt: Date.now()
                }).then(() => {
                    alert("Paste berhasil disimpan!");
                    window.location.hash = newKey;
                    window.newPasteForm();
                }).catch((error) => {
                    console.error("Error:", error);
                    alert("Gagal menyimpan! Pastikan Rules Realtime Database sudah diatur ke true.");
                });
            }
        };

        // Render Daftar Paste ke Sidebar (Mendukung Filter Pencarian)
        window.renderPasteList = function(filterText = "") {
            const listEl = document.getElementById('paste-list');
            const data = allPastes;

            if (!data || Object.keys(data).length === 0) {
                listEl.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">Belum ada data paste.</div>';
                return;
            }

            listEl.innerHTML = "";
            const filteredKeys = Object.keys(data).reverse().filter(key => {
                const item = data[key];
                return item.title.toLowerCase().includes(filterText.toLowerCase());
            });

            if (filteredKeys.length === 0) {
                listEl.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">Pencarian tidak ditemukan.</div>';
                return;
            }

            filteredKeys.forEach((key) => {
                const item = data[key];
                const hasPass = item.password && item.password.length > 0;
                listEl.innerHTML += `
                    <div onclick="selectPaste('${key}')" class="bg-[#262626] p-3 rounded-xl border border-slate-800 hover:border-cyan-500 cursor-pointer transition flex justify-between items-center">
                        <div class="overflow-hidden pr-2">
                            <div class="font-semibold text-sm text-slate-100 truncate">${item.title}</div>
                            <div class="text-[11px] text-slate-400 mt-1">
                                <i class="fa-solid ${hasPass ? 'fa-lock text-cyan-400' : 'fa-lock-open text-slate-500'} mr-1"></i>
                                ${hasPass ? 'Terkunci (Pembuat Saja)' : 'Publik'}
                            </div>
                        </div>
                    </div>
                `;
            });
        };

        // Muat Data dari Firebase secara Real-time
        window.loadPastes = function() {
            const statusEl = document.getElementById('status-conn');

            onValue(ref(db, 'pastes'), (snapshot) => {
                statusEl.textContent = "Terhubung";
                statusEl.className = "text-xs text-emerald-400 font-medium";

                const data = snapshot.val();
                allPastes = data || {};

                const searchKeyword = document.getElementById('search-box').value;
                window.renderPasteList(searchKeyword);

                const hashKey = window.location.hash.substring(1);
                if (hashKey && allPastes[hashKey]) {
                    window.openPaste(hashKey);
                }
            }, (error) => {
                statusEl.textContent = "Koneksi Gagal";
                statusEl.className = "text-xs text-red-400 font-medium";
                console.error(error);
            });
        };

        // Event Listener untuk Kolom Pencarian
        window.setupSearch = function() {
            const searchBox = document.getElementById('search-box');
            searchBox.addEventListener('input', (e) => {
                window.renderPasteList(e.target.value);
            });
        };

        // Pilih Paste dari Sidebar (Mengubah URL Hash)
        window.selectPaste = function(key) {
            window.location.hash = key;
            window.openPaste(key);
        };

        // Buka Paste Berdasarkan Key
        window.openPaste = function(key) {
            const item = allPastes[key];
            if (!item) return;

            currentKey = key;
            document.getElementById('paste-title').value = item.title;
            document.getElementById('paste-password').value = item.password || "";
            document.getElementById('paste-content').value = item.content;
            document.getElementById('btn-delete').classList.remove('hidden');
            document.getElementById('btn-copy').classList.remove('hidden');
            document.getElementById('btn-share').classList.remove('hidden');
        };

        // Hapus Paste (Wajib Password jika terkunci)
        window.deleteCurrentPaste = function() {
            if (!currentKey) return;
            const item = allPastes[currentKey];
            if (!item) return;

            if (item.password && item.password.length > 0) {
                const inputPass = prompt("File ini dikunci. Masukkan password untuk menghapus:");
                if (inputPass === null) return;
                if (inputPass !== item.password) {
                    alert("Password salah! Catatan gagal dihapus.");
                    return;
                }
            } else {
                if (!confirm("Yakin ingin menghapus catatan publik ini?")) return;
            }

            remove(ref(db, 'pastes/' + currentKey)).then(() => {
                alert("Catatan berhasil dihapus.");
                window.location.hash = "";
                window.newPasteForm();
            }).catch((error) => {
                console.error("Gagal menghapus:", error);
                alert("Terjadi kesalahan saat menghapus catatan.");
            });
        };

        // Salin Isi Teks
        window.copyContent = function() {
            const content = document.getElementById('paste-content').value;
            navigator.clipboard.writeText(content).then(() => {
                alert("Teks berhasil disalin ke clipboard!");
            });
        };

        // Salin Link Spesifik File
        window.shareLink = function() {
            if (!currentKey) return;
            const shareUrl = window.location.href;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("Link unik file berhasil disalin! Bagikan link ini ke orang lain.");
            });
        };

        // Reset Form untuk Buat Baru
        window.newPasteForm = function() {
            currentKey = null;
            window.location.hash = "";
            document.getElementById('paste-title').value = "";
            document.getElementById('paste-password').value = "";
            document.getElementById('paste-content').value = "";
            document.getElementById('btn-delete').classList.add('hidden');
            document.getElementById('btn-copy').classList.add('hidden');
            document.getElementById('btn-share').classList.add('hidden');
        };

        window.onload = () => {
            window.setupSearch();
            window.loadPastes();
        };
    </script>
</head>
<body class="bg-[#1a1a1a] text-gray-200 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation -->
    <header class="bg-[#242424] border-b border-gray-700 px-4 sm:px-6 py-3 flex justify-between items-center shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <a href="../" class="text-slate-400 hover:text-white transition text-sm flex items-center gap-1.5 bg-[#2a2a2a] px-3 py-1.5 rounded-lg border border-gray-700" title="Kembali ke Parent Directory">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="text-xs font-medium">Home</span>
            </a>
            <div class="h-4 w-[1px] bg-gray-700"></div>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-lock text-cyan-400 text-lg sm:text-xl"></i>
                <span class="font-bold text-base sm:text-lg text-white tracking-wide">Paste Text</span>
            </div>
        </div>
        <div id="status-conn" class="text-xs text-yellow-400">Menghubungkan...</div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-80 bg-[#1f1f1f] border-b md:border-b-0 md:border-r border-gray-700 flex flex-col h-64 md:h-auto shrink-0">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <span class="font-semibold text-sm text-gray-300"><i class="fa-solid fa-list mr-2"></i>Daftar Paste</span>
                <button onclick="newPasteForm()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-plus mr-1"></i> Baru
                </button>
            </div>
            <!-- Kolom Pencarian di Bawah Daftar Paste -->
            <div class="p-3 border-b border-gray-800 bg-[#222]">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-xs text-gray-400"></i>
                    <input id="search-box" type="text" placeholder="Cari judul paste..." 
                        class="w-full bg-[#1a1a1a] border border-gray-700 pl-8 pr-3 py-2 rounded text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
            </div>
            <div id="paste-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <div class="text-xs text-gray-500 text-center py-4">Memuat data...</div>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 flex flex-col bg-[#141414] p-4 sm:p-6 overflow-y-auto">
            <div id="editor-view" class="max-w-4xl w-full mx-auto flex flex-col h-full space-y-4">
                <div class="flex flex-col sm:flex-row gap-3">
                    <input id="paste-title" type="text" placeholder="Judul Paste / Nama File..." 
                        class="flex-1 bg-[#222] border border-gray-700 px-4 py-2.5 rounded text-sm text-white focus:outline-none focus:border-cyan-500">
                    
                    <input id="paste-password" type="password" placeholder="Kunci Password (Opsional)..." 
                        class="w-full sm:w-56 bg-[#222] border border-gray-700 px-4 py-2.5 rounded text-sm text-white focus:outline-none focus:border-cyan-500" title="Jika diisi, file hanya bisa dihapus/diperbarui oleh yang memegang password">
                </div>

                <textarea id="paste-content" placeholder="Tulis atau tempel teks/kode di sini..." 
                    class="w-full flex-1 min-h-[250px] sm:min-h-0 bg-[#1e1e1e] border border-gray-700 p-4 rounded text-sm font-mono text-gray-100 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
               
                <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 pt-2">
                    <div class="flex flex-wrap gap-2">
                        <button id="btn-delete" onclick="deleteCurrentPaste()" class="hidden bg-red-600/80 hover:bg-red-500 text-white font-semibold px-4 py-2.5 rounded text-sm transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trash"></i> Hapus
                        </button>
                        <button id="btn-copy" onclick="copyContent()" class="hidden bg-gray-700 hover:bg-gray-600 text-white font-semibold px-4 py-2.5 rounded text-sm transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-copy"></i> Salin Teks
                        </button>
                        <button id="btn-share" onclick="shareLink()" class="hidden bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-4 py-2.5 rounded text-sm transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-share-nodes"></i> Salin Link
                        </button>
                    </div>
                    <button onclick="savePaste()" class="bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-semibold px-6 py-2.5 rounded text-sm transition shadow-lg flex items-center justify-center gap-2 sm:ml-auto">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Paste
                    </button>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
