<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Serbaguna - Login / Register</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 id="form-title" class="text-2xl font-bold text-gray-800">Selamat Datang!</h1>
            <p id="form-subtitle" class="text-sm text-gray-500 mt-1">Silakan masuk ke akunmu</p>
        </div>

        <!-- Pesan Error / Sukses -->
        <div id="alert-box" class="hidden mb-4 p-3 text-sm rounded-lg"></div>

        <!-- Form Input -->
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                Masuk
            </button>
        </form>

        <!-- Tombol Beralih Mode (Login <-> Register) -->
        <div class="text-center mt-6">
            <p id="toggle-text" class="text-sm text-gray-600">
                Belum punya akun? 
                <button onclick="toggleMode()" class="text-indigo-600 font-semibold hover:underline">Daftar di sini</button>
            </p>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ==========================================
        // GANTI DENGAN KREDENSIAL FIREBASE KAMU NANTI
        // ==========================================
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_KAMU",
            authDomain: "MASUKKAN_AUTH_DOMAIN_KAMU",
            projectId: "MASUKKAN_PROJECT_ID_KAMU",
            storageBucket: "MASUKKAN_STORAGE_BUCKET_KAMU",
            messagingSenderId: "MASUKKAN_MESSAGING_SENDER_ID_KAMU",
            appId: "MASUKKAN_APP_ID_KAMU"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isRegisterMode = false;

        // Fungsi Switch Login / Register
        window.toggleMode = function() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const btn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');

            if (isRegisterMode) {
                title.innerText = "Buat Akun Baru";
                subtitle.innerText = "Daftar untuk mulai menggunakan web";
                btn.innerText = "Daftar";
                toggleText.innerHTML = `Sudah punya akun? <button onclick="toggleMode()" class="text-indigo-600 font-semibold hover:underline">Masuk</button>`;
            } else {
                title.innerText = "Selamat Datang!";
                subtitle.innerText = "Silakan masuk ke akunmu";
                btn.innerText = "Masuk";
                toggleText.innerHTML = `Belum punya akun? <button onclick="toggleMode()" class="text-indigo-600 font-semibold hover:underline">Daftar di sini</button>`;
            }
        }

        // Handle Proses Login / Register
        window.handleAuth = function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            alertBox.classList.add('hidden');

            if (isRegisterMode) {
                // Proses Daftar
                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        showAlert("Pendaftaran berhasil! Mengalihkan...", "success");
                        setTimeout(() => window.location.href = "dashboard.html", 1500);
                    })
                    .catch((error) => {
                        showAlert(error.message, "error");
                    });
            } else {
                // Proses Login
                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        showAlert("Login berhasil! Mengalihkan...", "success");
                        setTimeout(() => window.location.href = "dashboard.html", 1500);
                    })
                    .catch((error) => {
                        showAlert("Email atau Password salah.", "error");
                    });
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (type === 'error') {
                alertBox.classList.add('bg-red-100', 'text-red-700');
            } else {
                alertBox.classList.add('bg-green-100', 'text-green-700');
            }
        }

        // Cek jika sudah login, langsung lempar ke dashboard
        onAuthStateChanged(auth, (user) => {
            if (user && window.location.pathname.includes("index.html")) {
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
