<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matkul Navigator - GitHub Shortcut</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#110E1B',
                        cardDark: '#1A162B',
                        inputBg: '#131021',
                        accentOrange: '#FF8A00',
                        accentPurple: '#9D4EDD',
                        accentGlow: 'rgba(255, 138, 0, 0.25)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #110E1B;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        /* Glowing Accent Focus for Input Box */
        .glow-input {
            border: 2px solid #FF8A00;
            box-shadow: 0 0 20px rgba(255, 138, 0, 0.25);
            transition: all 0.3s ease;
        }

        .glow-input:focus-within {
            box-shadow: 0 0 28px rgba(255, 138, 0, 0.45);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #110E1B;
        }
        ::-webkit-scrollbar-thumb {
            background: #2D2744;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9D4EDD;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl bg-cardDark rounded-3xl p-6 sm:p-10 border border-white/5 shadow-2xl relative overflow-hidden">
        
        <!-- Subtle Glow Background Effect -->
        <div class="absolute -top-24 -left-24 w-60 h-60 bg-accentPurple/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-accentOrange/15 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-accentOrange to-accentPurple text-white text-3xl mb-4 shadow-lg shadow-accentOrange/20">
                <i class="fa-solid fa-code-branch"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white font-heading tracking-tight flex items-center justify-center gap-3">
                Matkul Navigator
            </h1>
            <p class="text-slate-400 mt-2 text-sm sm:text-base max-w-md mx-auto">
                Ketik nama mata kuliah untuk membuka repository GitHub secara otomatis.
            </p>
        </div>

        <!-- Custom figuringexistence Config -->
        <div class="mb-6 bg-inputBg/60 p-3.5 sm:p-4 rounded-xl border border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs sm:text-sm">
            <label for="figuringexistence" class="text-slate-300 font-medium flex items-center gap-2">
                <i class="fa-brands fa-github text-base text-accentOrange"></i>
                GitHub figuringexistence / Org Default:
            </label>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <span class="text-slate-500 font-mono hidden sm:inline">github.com/</span>
                <input 
                    type="text" 
                    id="figuringexistence" 
                    value="my-figuringexistence" 
                    placeholder="figuringexistence"
                    class="bg-cardDark text-white px-3 py-1.5 rounded-lg border border-white/10 focus:outline-none focus:border-accentOrange font-mono w-full sm:w-40 text-xs sm:text-sm"
                    oninput="updateUrl()"
                >
            </div>
        </div>

        <!-- Form Input Utama -->
        <div class="space-y-6 relative z-10">
            
            <!-- INPUT FIELD (YOU SAY) -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="matkulInput" class="text-xs font-bold tracking-wider text-accentOrange uppercase flex items-center gap-2">
                        <i class="fa-solid fa-keyboard"></i> Nama Mata Kuliah
                    </label>
                    <span id="shortcutBadge" class="text-[10px] bg-accentPurple/20 text-accentPurple px-2 py-0.5 rounded font-mono hidden">
                        Shortcut Mapped
                    </span>
                </div>
                <div class="glow-input rounded-2xl bg-inputBg p-1">
                    <textarea 
                        id="matkulInput" 
                        rows="3" 
                        placeholder="Ketik nama matkul (contoh: pemdas, pbo, jarkom, strukdat)..."
                        class="w-full bg-transparent text-white placeholder-slate-500 p-4 focus:outline-none resize-none font-medium text-base sm:text-lg"
                        oninput="handleInput()"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                </div>
            </div>

            <!-- PREVIEW / DESTINATION (THE GHOST SAYS) -->
            <div>
                <label class="block text-xs font-bold tracking-wider text-accentOrange uppercase mb-2">
                    <i class="fa-solid fa-link"></i> Repository Destination
                </label>
                <div class="w-full bg-inputBg/80 border border-white/5 rounded-2xl p-4 min-h-[64px] flex items-center justify-between gap-3">
                    <div id="urlPreview" class="text-slate-400 font-mono text-xs sm:text-sm truncate select-all">
                        ...
                    </div>
                    <button 
                        id="copyBtn"
                        onclick="copyToClipboard()"
                        title="Copy Link"
                        class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-white/5 transition-colors hidden"
                    >
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- Controls & Auto-Redirect Toggle -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
                <label class="inline-flex items-center gap-3 cursor-pointer text-xs sm:text-sm text-slate-300 self-start sm:self-auto">
                    <input type="checkbox" id="autoRedirect" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-accentOrange relative"></div>
                    <span>Tekan <kbd class="bg-white/10 px-1.5 py-0.5 rounded text-xs font-mono">Enter</kbd> untuk buka langsung</span>
                </label>

                <button 
                    id="openBtn"
                    onclick="openRepository()"
                    class="w-full sm:w-auto px-6 py-3 bg-gradient-to-r from-accentOrange to-accentPurple hover:opacity-90 text-white font-semibold rounded-xl shadow-lg shadow-accentOrange/20 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span>Buka Repository</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </button>
            </div>

            <!-- Shortcuts / Popular Presets -->
            <div class="pt-4 border-t border-white/5">
                <span class="text-xs text-slate-400 block mb-2 font-medium">Shortcut Cepat:</span>
                <div class="flex flex-wrap gap-2">
                    <button onclick="setMatkul('pemdas')" class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs text-slate-300 font-mono transition-colors">pemdas</button>
                    <button onclick="setMatkul('pbo')" class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs text-slate-300 font-mono transition-colors">pbo</button>
                    <button onclick="setMatkul('jarkom')" class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs text-slate-300 font-mono transition-colors">jarkom</button>
                    <button onclick="setMatkul('strukdat')" class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs text-slate-300 font-mono transition-colors">strukdat</button>
                    <button onclick="setMatkul('basdat')" class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs text-slate-300 font-mono transition-colors">basdat</button>
                    <button onclick="setMatkul('webprog')" class="px-3 py-1 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs text-slate-300 font-mono transition-colors">webprog</button>
                </div>
            </div>

        </div>

        <!-- Toast Notification Box -->
        <div id="toast" class="fixed bottom-6 right-6 bg-accentPurple text-white px-4 py-2.5 rounded-xl shadow-xl text-sm font-medium transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 pointer-events-none">
            <i class="fa-solid fa-circle-check"></i>
            <span id="toastMsg">Notification</span>
        </div>

    </div>

    <script>
        // Mapping shortcut kustom (bisa dikustomisasi lebih lanjut)
        const customShortcuts = {
            'pemdas': 'pemrograman-dasar',
            'pbo': 'pemrograman-berbasis-objek',
            'jarkom': 'jaringan-komputer',
            'strukdat': 'struktur-data',
            'basdat': 'basis-data',
            'webprog': 'pemrograman-web',
            'alpro': 'algoritma-pemrograman',
            'matdis': 'matematika-diskrit'
        };

        let currentTargetUrl = "";

        function handleInput() {
            updateUrl();
        }

        function updateUrl() {
            const rawInput = document.getElementById('matkulInput').value.trim().toLowerCase();
            const figuringexistence = document.getElementById('figuringexistence').value.trim() || 'figuringexistence';
            const urlPreview = document.getElementById('urlPreview');
            const copyBtn = document.getElementById('copyBtn');
            const shortcutBadge = document.getElementById('shortcutBadge');

            if (!rawInput) {
                urlPreview.innerText = "...";
                urlPreview.classList.add('text-slate-400');
                urlPreview.classList.remove('text-accentOrange');
                copyBtn.classList.add('hidden');
                shortcutBadge.classList.add('hidden');
                currentTargetUrl = "";
                return;
            }

            // Cek apakah input berupa full URL GitHub
            if (rawInput.startsWith('http://') || rawInput.startsWith('https://')) {
                currentTargetUrl = rawInput;
                shortcutBadge.classList.add('hidden');
            } 
            // Cek apakah input berupa path kustom misal: "user/repo"
            else if (rawInput.includes('/')) {
                currentTargetUrl = `https://github.com/${rawInput}`;
                shortcutBadge.classList.add('hidden');
            } 
            // Cek pemetaan shortcut matkul
            else {
                const mappedRepo = customShortcuts[rawInput] || rawInput;
                currentTargetUrl = `https://github.com/${figuringexistence}/${mappedRepo}`;
                
                if (customShortcuts[rawInput]) {
                    shortcutBadge.classList.remove('hidden');
                } else {
                    shortcutBadge.classList.add('hidden');
                }
            }

            urlPreview.innerText = currentTargetUrl;
            urlPreview.classList.remove('text-slate-400');
            urlPreview.classList.add('text-accentOrange');
            copyBtn.classList.remove('hidden');
        }

        function handleKeyDown(event) {
            // Jika ditekan Enter tanpa Shift
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                const isAutoRedirect = document.getElementById('autoRedirect').checked;
                
                if (isAutoRedirect) {
                    openRepository();
                }
            }
        }

        function openRepository() {
            if (!currentTargetUrl) {
                showToast("Silakan ketik nama mata kuliah terlebih dahulu!");
                return;
            }
            
            // Buka link di tab baru
            window.open(currentTargetUrl, '_blank');
            showToast("Membuka Repository GitHub...");
        }

        function setMatkul(name) {
            const input = document.getElementById('matkulInput');
            input.value = name;
            updateUrl();
            input.focus();
        }

        function copyToClipboard() {
            if (!currentTargetUrl) return;
            
            // Menggunakan execCommand untuk kompatibilitas iframe
            const textarea = document.createElement('textarea');
            textarea.value = currentTargetUrl;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast("URL berhasil disalin ke clipboard!");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Jalankan updateUrl saat awal dimuat
        window.onload = function() {
            updateUrl();
        }
    </script>
</body>
</html>
