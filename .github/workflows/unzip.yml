name: Ekstrak ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-job:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repositori
        uses: actions/checkout@v4

      - name: Ekstrak Yoz.zip
        run: |
          unzip -o Yoz.zip -d .
          rm Yoz.zip

      - name: Simpan hasil ekstrak ke repositori
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Ekstrak Yoz.zip otomatis"
          git push
