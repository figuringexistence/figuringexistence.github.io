<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050814;
            background-image: radial-gradient(circle at 80% 15%, rgba(56, 189, 248, 0.08), transparent 40%),
                              radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.08), transparent 45%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 32px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #94a3b8;
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.16);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            border-color: rgba(124, 58, 237, 0.6);
            box-shadow: 0 14px 30px rgba(76, 29, 149, 0.28);
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .caption {
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            inset: 0;
            background-color: rgba(3, 6, 16, 0.92);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 92%;
            max-height: 80vh;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.7);
        }

        .lightbox-caption {
            color: #e2e8f0;
            margin-top: 14px;
            font-size: 1rem;
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 28px;
            color: #cbd5e1;
            font-size: 38px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galeri Foto</h1>
        <p>Klik pada foto untuk memperbesar tampilan</p>
    </header>

    <div class="gallery" id="gallery"></div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
        const galleryContainer = document.getElementById('gallery');
        const maksimalFoto = 100;
        const ekstensiList = ['jpg', 'jpeg', 'png', 'JPG'];

        for (let i = 1; i <= maksimalFoto; i++) {
            const captionText = `Foto ${i}`;

            const item = document.createElement('div');
            item.className = 'gallery-item';

            const img = document.createElement('img');
            img.alt = captionText;
            img.loading = 'lazy';

            let extIndex = 0;
            img.src = `./${i}.${ekstensiList[extIndex]}`;
            item.onclick = () => openLightbox(img.src, captionText);

            img.onerror = () => {
                extIndex++;
                if (extIndex < ekstensiList.length) {
                    img.src = `./${i}.${ekstensiList[extIndex]}`;
                } else {
                    item.remove();
                }
            };

            const caption = document.createElement('div');
            caption.className = 'caption';
            caption.textContent = captionText;

            item.appendChild(img);
            item.appendChild(caption);
            galleryContainer.appendChild(item);
        }

        function openLightbox(imageSrc, captionText) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');

            lightboxImg.src = imageSrc;
            lightboxCaption.textContent = captionText;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }
    </script>

</body>
</html>
