
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            color: #222;
        }

        header p {
            color: #666;
            margin-top: 5px;
        }

        /* Grid Galeri Responsif */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: #fff;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .caption {
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: #555;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .lightbox-caption {
            color: #fff;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galeri Foto</h1>
        <p>Klik pada foto untuk memperbesar tampilan</p>
    </header>

    <div class="gallery">
        <!-- Foto Utama: 1.jpg -->
        <div class="gallery-item" onclick="openLightbox('1.jpg', 'Foto 1')">
            <img src="1.jpg" alt="Foto 1" loading="lazy">
            <div class="caption">Foto 1</div>
        </div>

        <!-- Contoh tambahan jika nanti ada 2.jpg dan 3.jpg -->
        <div class="gallery-item" onclick="openLightbox('2.jpg', 'Foto 2')">
            <img src="2.jpg" alt="Foto 2" loading="lazy">
            <div class="caption">Foto 2</div>
        </div>

        <div class="gallery-item" onclick="openLightbox('3.jpg', 'Foto 3')">
            <img src="3.jpg" alt="Foto 3" loading="lazy">
            <div class="caption">Foto 3</div>
        </div>
    </div>

    <!-- Modal Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script>
        function openLightbox(imageSrc, captionText) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');

            lightboxImg.src = imageSrc;
            lightboxCaption.textContent = captionText;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
        }
    </script>

</body>
</html>
