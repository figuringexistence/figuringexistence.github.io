<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna - Unimugo Space</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yuditif: {
                            bg: '#131314',
                            surface: '#1e1f20',
                            border: '#333537',
                            primary: '#8ab4f8',
                            accent: '#c4b5fd',
                            hover: '#2d2f31'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-yuditif-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <header class="border-b border-yuditif-border bg-yuditif-surface/85 backdrop-blur sticky top-0 z-40 px-6 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3 text-white font-bold text-base">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-sparkles text-white text-sm"></i>
            </div>
            <span>Unimugo Space</span>
        </a>

        <!-- Form Cari Teman / Username -->
        <div class="flex-1 max-w-sm mx-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="search-username-input" placeholder="Cari berdasarkan username..." class="w-full bg-yuditif-bg border border-yuditif-border rounded-xl pl-10 pr-4 py-2 text-xs text-white focus:outline-none focus:border-yuditif-primary">
            </div>
        </div>

        <a href="index.html" class="px-3 py-1.5 bg-yuditif-bg hover:bg-yuditif-hover border border-yuditif-border rounded-xl text-xs font-medium text-yuditif-primary transition-all">
            <i class="fa-solid fa-arrow-left mr-1.5"></i> Kembali ke Beranda
        </a>
    </header>

    <!-- Main Container Profil -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
        
        <!-- Header / Banner Profil -->
        <div class="bg-yuditif-surface border border-yuditif-border rounded-2xl overflow-hidden shadow-xl">
            <!-- Foto Sampul (Cover) dengan Tombol Ubah & Hapus -->
            <div id="profile-cover-bg" class="h-48 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 relative bg-cover bg-center">
                <div id="cover-action-buttons" class="absolute bottom-3 right-3 flex items-center gap-2">
                    <!-- Tombol Ganti Sampul -->
                    <label class="cursor-pointer bg-black/60 hover:bg-black/80 text-white px-3 py-1.5 rounded-xl text-xs font-medium backdrop-blur flex items-center gap-1.5 transition-all shadow">
                        <i class="fa-solid fa-camera"></i> Ubah Sampul
                        <input type="file" id="upload-cover-file" accept="image/*" class="hidden">
                    </label>
                    <!-- Tombol Hapus Sampul -->
                    <button id="delete-cover-btn" class="bg-red-600/80 hover:bg-red-700 text-white px-2.5 py-1.5 rounded-xl text-xs font-medium backdrop-blur transition-all shadow" title="Hapus Sampul">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>

            <!-- Info Profil Utama -->
            <div class="px-6 pb-6 relative flex flex-col sm:flex-row items-center sm:items-end justify-between gap-4 -mt-16 text-center sm:text-left">
                <div class="flex flex-col sm:flex-row items-center gap-4">
                    <!-- Foto Profil & Tombol Ganti/Hapus -->
                    <div class="relative group">
                        <img id="profile-avatar-img" src="https://via.placeholder.com/150" alt="Foto Profil" class="w-32 h-32 rounded-full border-4 border-yuditif-surface object-cover shadow-lg bg-gray-700">
                        
                        <!-- Overlay Ganti/Hapus Foto Profil -->
                        <div class="absolute inset-0 rounded-full bg-black/50 opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center gap-2">
                            <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full text-xs shadow" title="Ganti Foto">
                                <i class="fa-solid fa-pen"></i>
                                <input type="file" id="upload-avatar-file" accept="image/*" class="hidden">
                            </label>
                            <button id="delete-avatar-btn" class="bg-red-600 hover:bg-red-700 text-white p-2 rounded-full text-xs shadow" title="Hapus Foto">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="space-y-1 pt-2 sm:pt-16">
                        <h1 id="profile-view-name" class="text-2xl font-bold">Memuat Nama...</h1>
                        <p class="text-xs text-yuditif-primary font-mono">Username: <span id="profile-view-username">@username</span></p>
                        <p id="profile-view-bio" class="text-xs text-gray-300 italic">Belum ada bio.</p>
                    </div>
                </div>

                <!-- Tombol Aksi (Tambah Teman / Status) -->
                <div id="profile-action-container" class="flex items-center gap-2"></div>
            </div>
        </div>

        <!-- Form Edit Profil & Pengaturan Username (Khusus Pemilik Akun) -->
        <div id="edit-profile-section" class="bg-yuditif-surface border border-yuditif-border rounded-2xl p-6 shadow-lg space-y-4">
            <h3 class="text-sm font-bold flex items-center gap-2 text-yuditif-primary">
                <i class="fa-solid fa-user-pen"></i> Pengaturan & Kustomisasi Profil
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">Nama Tampilan</label>
                    <input type="text" id="edit-display-name" class="w-full bg-yuditif-bg border border-yuditif-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yuditif-primary">
                </div>
                <div>
                    <label class="block text-[11px] text-gray-400 mb-1">Username Unik (@)</label>
                    <input type="text" id="edit-username" placeholder="Contoh: yudit_tif" class="w-full bg-yuditif-bg border border-yuditif-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yuditif-primary">
                </div>
            </div>
            <div>
                <label class="block text-[11px] text-gray-400 mb-1">Bio / Status Singkat</label>
                <textarea id="edit-bio" rows="2" class="w-full bg-yuditif-bg border border-yuditif-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-yuditif-primary resize-none"></textarea>
            </div>
            <button id="btn-save-profile" class="w-full py-2.5 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white rounded-xl text-xs font-medium transition-all shadow-md">
                Simpan Perubahan Profil
            </button>
        </div>

        <!-- Tab Navigasi Profil -->
        <div class="flex border-b border-yuditif-border gap-6 text-sm font-medium text-gray-400">
            <button class="pb-3 border-b-2 border-yuditif-primary text-white">Postingan Pengguna</button>
            <button class="pb-3 hover:text-white transition-all">Daftar Teman</button>
            <button class="pb-3 hover:text-white transition-all">Tentang</button>
        </div>

        <!-- Daftar Postingan Pengguna Ini -->
        <div id="user-posts-container" class="space-y-4">
            <div class="text-center py-10 text-gray-500 text-xs">Memuat postingan...</div>
        </div>

    </main>

    <!-- Menghubungkan ke file profil.js di folder code -->
    <script type="module" src="code/profil.js"></script>
</body>
</html>
