<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tombol Tautan Hastebin</title>
    <style>
        .btn-hastebin {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2b6cb0; /* Warna biru */
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn-hastebin:hover {
            background-color: #2c5282; /* Warna biru lebih gelap saat kursor di atasnya */
        }
    </style>
</head>
<body>

    <!-- Tombol tautan ke Hastebin -->
    <a href="https://hastebin.com/share/ufaxulecew.csharp" class="btn-hastebin" target="_blank">
        Pemdas
    </a>
     <a href="https://hastebin.com/share/oqodupewid.yaml" class="btn-hastebin" target="_blank">
        Pemdas
    </a>

</body>
</html>
