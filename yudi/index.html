<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPaste - Sederhana & Cepat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#1a1a1a] text-gray-200 h-screen flex flex-col font-sans">

    <!-- Top Navigation -->
    <header class="bg-[#242424] border-b border-gray-700 px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-code text-cyan-400 text-xl"></i>
            <span class="font-bold text-lg text-white tracking-wide">MyPasteBin</span>
        </div>
        <div class="text-xs text-gray-400">GitHub Pages & Firebase Ready</div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar: Daftar File / Paste Sebelumnya -->
        <aside class="w-80 bg-[#1f1f1f] border-r border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <span class="font-semibold text-sm text-gray-300"><i class="fa-solid fa-list mr-2"></i>Daftar Paste</span>
                <button onclick="newPasteForm()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-plus mr-1"></i> Baru
                </button>
            </div>
            <div id="paste-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Daftar item akan dimuat di sini secara dinamis -->
                <div class="text-xs text-gray-500 text-center py-4">Memuat daftar...</div>
            </div>
        </aside>

        <!-- Content Area / Editor & Viewer -->
        <main class="flex-1 flex flex-col bg-[#141414] p-6 overflow-y-auto">
            <div id="editor-view" class="max-w-4xl w-full mx-auto flex flex-col h-full space-y-4">
                <div class="flex space-x-4">
                    <input id="paste-title" type="text" placeholder="Judul Paste / Nama File..." 
                        class="flex-1 bg-[#222] border border-gray-700 px-4 py-2.5 rounded text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div class="flex-1 flex flex-col">
                    <textarea id="paste-content" placeholder="Tulis atau tempel (paste) teks/kode Anda di sini..." 
                        class="w-full flex-1 bg-[#1e1e1e] border border-gray-700 p-4 rounded text-sm font-mono text-gray-100 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                </div>
                <div class="flex justify-end">
                    <button onclick="savePaste()" class="bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-semibold px-6 py-2.5 rounded text-sm transition shadow-lg">
                        <i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Paste
                    </button>
                </div>
            </div>

            <!-- Viewer View (Saat salah satu item di sidebar diklik) -->
            <div id="viewer-view" class="max-w-4xl w-full mx-auto hidden flex flex-col h-full space-y-4">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <h2 id="view-title" class="text-lg font-bold text-white"></h2>
                    <button onclick="newPasteForm()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-gray-300">Kembali ke Editor</button>
                </div>
                <pre id="view-content" class="flex-1 bg-[#1e1e1e] border border-gray-700 p-4 rounded text-sm font-mono text-gray-200 overflow-auto whitespace-pre-wrap"></pre>
            </div>
        </main>
    </div>

    <!-- Script Integrasi Firebase (Contoh Menggunakan localStorage / Firebase) -->
    <script>
        // Simulasi Penyimpanan menggunakan LocalStorage (Agar langsung bisa dicoba offline/GitHub Pages tanpa ribet setup database dulu)
        // Untuk production online antar pengguna, ganti bagian ini dengan Firebase Firestore SDK.
        
        let pastes = JSON.parse(localStorage.getItem('mypastes')) || [
            { id: '1', title: 'Contoh Kode C - Halo Dunia', content: '#include <stdio.h>\n\nint main() {\n    printf("Halo Unimugo!\\n");\n    return 0;\n}', date: '2026-11-14' }
        ];

        function renderList() {
            const listContainer = document.getElementById('paste-list');
            listContainer.innerHTML = '';
            
            if (pastes.length === 0) {
                listContainer.innerHTML = '<div class="text-xs text-gray-500 text-center py-4">Belum ada paste.</div>';
                return;
            }

            pastes.forEach(p => {
                const item = document.createElement('div');
                item.className = "bg-[#252525] hover:bg-[#2d2d2d] p-3 rounded cursor-pointer transition border border-gray-800 flex flex-col space-y-1";
                item.onclick = () => viewPaste(p.id);
                item.innerHTML = `
                    <div class="font-semibold text-sm text-cyan-400 truncate">${escapeHtml(p.title || 'Tanpa Judul')}</div>
                    <div class="text-[10px] text-gray-400">${p.date}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        function savePaste() {
            const title = document.getElementById('paste-title').value.trim();
            const content = document.getElementById('paste-content').value.trim();

            if (!content) {
                alert('Konten paste tidak boleh kosong!');
                return;
            }

            const newEntry = {
                id: Date.now().toString(),
                title: title || 'Untitled Paste',
                content: content,
                date: new Date().toLocaleDateString()
            };

            pastes.unshift(newEntry);
            localStorage.setItem('mypastes', JSON.stringify(pastes));
            
            document.getElementById('paste-title').value = '';
            document.getElementById('paste-content').value = '';
            
            renderList();
            viewPaste(newEntry.id);
        }

        function viewPaste(id) {
            const paste = pastes.find(p => p.id === id);
            if (!paste) return;

            document.getElementById('editor-view').classList.add
