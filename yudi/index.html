<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPaste - Secure with Password</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "GANTI_DENGAN_API_KEY_ANDA",
            authDomain: "GANTI_DENGAN_AUTH_DOMAIN_ANDA",
            projectId: "GANTI_DENGAN_PROJECT_ID_ANDA",
            storageBucket: "GANTI_DENGAN_STORAGE_BUCKET_ANDA",
            messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID_ANDA",
            appId: "GANTI_DENGAN_APP_ID_ANDA"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.getDoc = getDoc;
        window.deleteDoc = deleteDoc;
        window.serverTimestamp = serverTimestamp;

        window.loadPastes();
    </script>
</head>
<body class="bg-[#1a1a1a] text-gray-200 h-screen flex flex-col font-sans">

    <!-- Top Navigation -->
    <header class="bg-[#242424] border-b border-gray-700 px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-lock text-cyan-400 text-xl"></i>
            <span class="font-bold text-lg text-white tracking-wide">MyPaste Secure</span>
        </div>
        <div id="status-conn" class="text-xs text-yellow-400">Menghubungkan...</div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-80 bg-[#1f1f1f] border-r border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <span class="font-semibold text-sm text-gray-300"><i class="fa-solid fa-list mr-2"></i>Daftar Paste</span>
                <button onclick="newPasteForm()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1.5 rounded transition">
                    <i class="fa-solid fa-plus mr-1"></i> Baru
                </button>
            </div>
            <div id="paste-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <div class="text-xs text-gray-500 text-center py-4">Memuat data...</div>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 flex flex-col bg-[#141414] p-6 overflow-y-auto">
            <!-- Editor View -->
            <div id="editor-view" class="max-w-4xl w-full mx-auto flex flex-col h-full space-y-4">
                <div class="flex space-x-3">
                    <input id="paste-title" type="text" placeholder="Judul Paste / Nama File..." 
                        class="flex-1 bg-[#222] border border-gray-700 px-4 py-2.5 rounded text-sm text-white focus:outline-none focus:border-cyan-500">
                    
                    <!-- Input Password Pengaman Sebelum Save -->
                    <input id="paste-password" type="password" placeholder="Password Pengaman..." 
                        class="w-48 bg-[#222] border border-gray-700 px-4 py-2.5 rounded text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>

                <textarea id="paste-content" placeholder="Tulis atau tempel teks/kode di sini..." 
                    class="w-full flex-1 bg-[#1e1e1e] border border-gray-700 p-4 rounded text-sm font-mono text-gray-100 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                
                <div class="flex justify-end">
                    <button onclick="savePaste()" class="bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-semibold px-6 py-2.5 rounded text-sm transition shadow-lg">
                        <i class
